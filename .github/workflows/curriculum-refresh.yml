name: Curriculum source refresh

on:
  schedule:
    - cron: '0 9 1 1,7 *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curriculum-source-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Check trusted curriculum sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_PROJECT_ID: kieltech
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Configure Firebase credentials
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT repository secret before running this workflow."
            exit 1
          fi
          credential_file="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credential_file"
          chmod 600 "$credential_file"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credential_file" >> "$GITHUB_ENV"

      - name: Install function dependencies
        run: npm ci --prefix functions

      - name: Build refresh runner
        run: npm run build --prefix functions

      - name: Check sources and write review proposals
        run: npm run refresh --prefix functions
