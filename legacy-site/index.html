<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,follow" />
    <meta name="theme-color" content="#0b1220" />
    <title>KielTech Academy has moved</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #0b1220;
        color: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at top, rgb(245 158 11 / 12%), transparent 55%),
          #0b1220;
      }

      main {
        width: min(100%, 640px);
        padding: clamp(28px, 6vw, 56px);
        border: 1px solid rgb(245 158 11 / 35%);
        border-radius: 24px;
        background: rgb(15 23 42 / 94%);
        box-shadow: 0 24px 80px rgb(0 0 0 / 35%);
        text-align: center;
      }

      .brand {
        margin: 0 0 12px;
        color: #fbbf24;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3rem);
        line-height: 1.1;
      }

      .message {
        margin: 20px auto 28px;
        max-width: 46ch;
        color: #cbd5e1;
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 14px 22px;
        border-radius: 12px;
        background: #f59e0b;
        color: #111827;
        font-weight: 800;
        text-decoration: none;
        overflow-wrap: anywhere;
        transition: background-color 150ms ease, transform 150ms ease;
      }

      a:hover {
        transform: translateY(-1px);
        background: #fbbf24;
      }

      a:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 4px;
      }

      .note {
        margin: 20px 0 0;
        color: #94a3b8;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">KielTech Academy</p>
      <h1>We’ve moved</h1>
      <p class="message">
        KielTech Academy has moved to a new website. Please update your
        bookmarks and visit us at our new address.
      </p>
      <a href="https://kieltech-academy.web.app/">
        Visit kieltech-academy.web.app
      </a>
      <p class="note">
        You’re seeing this notice because you visited our previous website.
      </p>
    </main>
  </body>
</html>
